<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a4fb5"/>
      <stop offset="100%" stop-color="#060e2a"/>
    </radialGradient>
    <!-- Bottle gradient -->
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2d8e"/>
      <stop offset="30%" stop-color="#1a5cd4"/>
      <stop offset="60%" stop-color="#2478f0"/>
      <stop offset="100%" stop-color="#0a2060"/>
    </linearGradient>
    <!-- Bottle highlight -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.22)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Cap gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2255cc"/>
      <stop offset="100%" stop-color="#0a1a60"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0,100,255,0.5)"/>
    </filter>
    <!-- Ice texture -->
    <filter id="iceGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bgGrad)"/>

  <!-- Background glow circles -->
  <circle cx="200" cy="180" r="160" fill="rgba(0,120,255,0.12)"/>
  <circle cx="200" cy="180" r="100" fill="rgba(0,180,255,0.08)"/>

  <!-- Ice cubes background -->
  <!-- Left ice cube -->
  <g opacity="0.7">
    <rect x="18" y="390" width="55" height="55" rx="6" fill="rgba(120,180,255,0.25)" stroke="rgba(180,220,255,0.6)" stroke-width="1.5" transform="rotate(-15,45,417)"/>
    <line x1="20" y1="410" x2="70" y2="400" stroke="rgba(200,230,255,0.3)" stroke-width="1"/>
    <line x1="25" y1="425" x2="68" y2="418" stroke="rgba(200,230,255,0.2)" stroke-width="1"/>
  </g>
  <!-- Right ice cube -->
  <g opacity="0.7">
    <rect x="320" y="370" width="65" height="65" rx="7" fill="rgba(120,180,255,0.25)" stroke="rgba(180,220,255,0.6)" stroke-width="1.5" transform="rotate(12,352,402)"/>
    <line x1="322" y1="390" x2="382" y2="380" stroke="rgba(200,230,255,0.3)" stroke-width="1"/>
    <line x1="325" y1="408" x2="380" y2="400" stroke="rgba(200,230,255,0.2)" stroke-width="1"/>
  </g>
  <!-- Small ice shards -->
  <polygon points="55,460 75,440 85,465" fill="rgba(150,200,255,0.3)" stroke="rgba(180,220,255,0.5)" stroke-width="1"/>
  <polygon points="300,450 325,435 330,458" fill="rgba(150,200,255,0.3)" stroke="rgba(180,220,255,0.5)" stroke-width="1"/>
  <polygon points="340,480 365,468 360,490" fill="rgba(150,200,255,0.25)" stroke="rgba(180,220,255,0.4)" stroke-width="1"/>

  <!-- Water splash effects -->
  <ellipse cx="200" cy="490" rx="140" ry="20" fill="rgba(0,150,255,0.2)"/>
  <!-- Splash drops -->
  <ellipse cx="80" cy="460" rx="8" ry="18" fill="rgba(100,180,255,0.35)" transform="rotate(-20,80,460)"/>
  <ellipse cx="320" cy="450" rx="6" ry="14" fill="rgba(100,180,255,0.35)" transform="rotate(15,320,450)"/>
  <ellipse cx="350" cy="420" rx="5" ry="11" fill="rgba(100,180,255,0.3)" transform="rotate(25,350,420)"/>
  <ellipse cx="55" cy="430" rx="4" ry="10" fill="rgba(100,180,255,0.3)" transform="rotate(-10,55,430)"/>

  <!-- BOTTLE BODY -->
  <!-- Bottle shape: narrow at neck, wider at body -->
  <g filter="url(#dropShadow)">
    <!-- Bottle body -->
    <path d="M148,148 L148,130 Q148,115 155,108 L168,95 L232,95 L245,108 Q252,115 252,130 L252,148
             Q265,158 268,175 L270,200 L270,430 Q270,450 250,460 L150,460 Q130,450 130,430 L130,200 L132,175 Q135,158 148,148 Z"
          fill="url(#bottleGrad)"/>
    <!-- Bottle highlight -->
    <path d="M155,148 L155,135 Q155,122 160,115 L170,105 L200,105 L200,460 L155,460 Q140,450 140,430 L140,200 L142,178 Q144,162 155,148 Z"
          fill="url(#highlightGrad)" opacity="0.6"/>
    <!-- Water condensation drops -->
    <circle cx="170" cy="280" r="2.5" fill="rgba(255,255,255,0.35)"/>
    <circle cx="175" cy="310" r="1.8" fill="rgba(255,255,255,0.3)"/>
    <circle cx="240" cy="260" r="2" fill="rgba(255,255,255,0.3)"/>
    <circle cx="235" cy="340" r="2.5" fill="rgba(255,255,255,0.35)"/>
    <circle cx="155" cy="350" r="1.5" fill="rgba(255,255,255,0.25)"/>
    <circle cx="248" cy="300" r="1.8" fill="rgba(255,255,255,0.3)"/>
    <!-- Condensation streaks -->
    <line x1="183" y1="220" x2="181" y2="255" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="230" y1="230" x2="228" y2="260" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Bottle cap -->
  <rect x="168" y="68" width="64" height="30" rx="8" fill="url(#capGrad)" stroke="rgba(100,150,255,0.5)" stroke-width="1.5"/>
  <!-- Cap ridges -->
  <line x1="178" y1="68" x2="178" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="188" y1="68" x2="188" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="198" y1="68" x2="198" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="208" y1="68" x2="208" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <line x1="218" y1="68" x2="218" y2="98" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- LABEL AREA -->
  <!-- Label background -->
  <rect x="135" y="290" width="130" height="130" rx="12" fill="rgba(10,30,100,0.85)" stroke="rgba(0,200,255,0.4)" stroke-width="1.5"/>

  <!-- "Lenny" text on label -->
  <text x="200" y="345" font-family="Arial Black, Arial" font-weight="900" font-size="36"
        fill="white" text-anchor="middle"
        style="paint-order:stroke" stroke="rgba(0,100,200,0.8)" stroke-width="3">Lenny</text>
  <!-- Lenny text glow -->
  <text x="200" y="345" font-family="Arial Black, Arial" font-weight="900" font-size="36"
        fill="rgba(180,220,255,0.4)" text-anchor="middle" filter="url(#softGlow)">Lenny</text>

  <!-- "BLUEBERRY" text -->
  <rect x="148" y="355" width="104" height="24" rx="4" fill="rgba(0,150,255,0.4)" stroke="rgba(100,200,255,0.5)" stroke-width="1"/>
  <text x="200" y="372" font-family="Arial Black, Arial" font-weight="900" font-size="13"
        fill="#00cfff" text-anchor="middle" letter-spacing="2">BLUEBERRY</text>

  <!-- Ice block under label text -->
  <rect x="138" y="282" width="124" height="18" rx="6" fill="rgba(100,180,255,0.25)" stroke="rgba(180,220,255,0.4)" stroke-width="1"/>

  <!-- POLAR BEAR MASCOT -->
  <g transform="translate(200, 235)" filter="url(#softGlow)">
    <!-- Bear body/chest (peeking over label) -->
    <ellipse cx="0" cy="28" rx="42" ry="30" fill="white"/>
    <!-- Bear head -->
    <circle cx="0" cy="-8" r="38" fill="white"/>
    <!-- Bear ears -->
    <circle cx="-28" cy="-36" r="12" fill="white"/>
    <circle cx="28" cy="-36" r="12" fill="white"/>
    <circle cx="-28" cy="-36" r="7" fill="rgba(220,220,230,0.8)"/>
    <circle cx="28" cy="-36" r="7" fill="rgba(220,220,230,0.8)"/>
    <!-- Bear face -->
    <!-- Eyes area (sunglasses) -->
    <!-- Sunglasses frame -->
    <rect x="-32" y="-22" width="26" height="16" rx="5" fill="#1a3a9e" stroke="#4488ff" stroke-width="1.5"/>
    <rect x="6" y="-22" width="26" height="16" rx="5" fill="#1a3a9e" stroke="#4488ff" stroke-width="1.5"/>
    <!-- Bridge of glasses -->
    <line x1="-6" y1="-14" x2="6" y2="-14" stroke="#4488ff" stroke-width="2"/>
    <!-- Lens shine -->
    <ellipse cx="-22" cy="-17" rx="6" ry="4" fill="rgba(100,200,255,0.45)" transform="rotate(-10,-22,-17)"/>
    <ellipse cx="18" cy="-17" rx="6" ry="4" fill="rgba(100,200,255,0.45)" transform="rotate(-10,18,-17)"/>
    <!-- Side arms of glasses -->
    <line x1="-32" y1="-14" x2="-44" y2="-10" stroke="#4488ff" stroke-width="2" stroke-linecap="round"/>
    <line x1="32" y1="-14" x2="44" y2="-10" stroke="#4488ff" stroke-width="2" stroke-linecap="round"/>
    <!-- Nose -->
    <ellipse cx="0" cy="-2" rx="8" ry="5" fill="#2a2a3a"/>
    <ellipse cx="-2" cy="-3" rx="2" ry="1.5" fill="rgba(255,255,255,0.5)"/>
    <!-- Mouth / smile -->
    <path d="M-12,8 Q0,18 12,8" fill="none" stroke="#2a2a3a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bear paws on bottle edge -->
    <ellipse cx="-36" cy="28" rx="12" ry="9" fill="white"/>
    <ellipse cx="36" cy="28" rx="12" ry="9" fill="white"/>
    <!-- Paw details -->
    <line x1="-41" y1="28" x2="-39" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-36" y1="27" x2="-34" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-31" y1="28" x2="-30" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="31" y1="28" x2="30" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="36" y1="27" x2="34" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="41" y1="28" x2="39" y2="36" stroke="rgba(200,200,210,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- BLUEBERRIES -->
  <!-- Bottom blueberries -->
  <g>
    <!-- Berry 1 -->
    <circle cx="95" cy="475" r="22" fill="#2a1a6e"/>
    <circle cx="95" cy="475" r="22" fill="none" stroke="#4a3a9e" stroke-width="1.5"/>
    <ellipse cx="88" cy="462" rx="6" ry="4" fill="rgba(100,80,180,0.5)" transform="rotate(-20,88,462)"/>
    <path d="M90,453 Q95,448 100,453" fill="none" stroke="#6a5aae" stroke-width="1.5"/>
    <line x1="95" y1="448" x2="95" y2="455" stroke="#4a8a40" stroke-width="2"/>
    <!-- Berry 2 -->
    <circle cx="148" cy="488" r="18" fill="#1e1460"/>
    <ellipse cx="142" cy="476" rx="5" ry="3" fill="rgba(80,60,150,0.5)" transform="rotate(-15,142,476)"/>
    <path d="M143,470 Q148,466 153,470" fill="none" stroke="#5a4a9e" stroke-width="1.5"/>
    <line x1="148" y1="466" x2="148" y2="472" stroke="#4a8a40" stroke-width="1.5"/>
    <!-- Berry 3 -->
    <circle cx="250" cy="487" r="20" fill="#261872"/>
    <ellipse cx="244" cy="474" rx="5" ry="3.5" fill="rgba(80,60,150,0.5)" transform="rotate(-15,244,474)"/>
    <path d="M244,468 Q250,464 256,468" fill="none" stroke="#5a4aae" stroke-width="1.5"/>
    <line x1="250" y1="464" x2="250" y2="470" stroke="#4a8a40" stroke-width="1.5"/>
    <!-- Berry 4 -->
    <circle cx="305" cy="472" r="24" fill="#1e1466"/>
    <ellipse cx="298" cy="458" rx="7" ry="4.5" fill="rgba(80,60,150,0.45)" transform="rotate(-20,298,458)"/>
    <path d="M298,450 Q305,445 312,450" fill="none" stroke="#5a4aae" stroke-width="1.5"/>
    <line x1="305" y1="445" x2="305" y2="452" stroke="#4a8a40" stroke-width="2"/>
    <!-- Berry 5 small -->
    <circle cx="200" cy="496" r="15" fill="#221670"/>
    <path d="M196,479 Q200,475 204,479" fill="none" stroke="#5a4aae" stroke-width="1.2"/>
    <line x1="200" y1="475" x2="200" y2="481" stroke="#4a8a40" stroke-width="1.5"/>
  </g>

  <!-- Leaves -->
  <ellipse cx="118" cy="458" rx="18" ry="8" fill="#3a8a30" transform="rotate(-35,118,458)"/>
  <ellipse cx="122" cy="456" rx="12" ry="5" fill="#4aaa40" transform="rotate(-35,122,456)"/>
  <ellipse cx="275" cy="462" rx="20" ry="8" fill="#3a8a30" transform="rotate(30,275,462)"/>
  <ellipse cx="278" cy="460" rx="14" ry="5" fill="#4aaa40" transform="rotate(30,278,460)"/>

  <!-- TOP TEXT: BLAUBÄRE -->
  <text x="52" y="62" font-family="Arial Black, Arial" font-weight="900" font-size="34"
        fill="white" text-anchor="start"
        style="paint-order:stroke" stroke="#0055cc" stroke-width="5">BLAUBÄRE</text>
  <!-- Glow copy -->
  <text x="52" y="62" font-family="Arial Black, Arial" font-weight="900" font-size="34"
        fill="rgba(100,180,255,0.3)" text-anchor="start" filter="url(#softGlow)">BLAUBÄRE</text>

  <!-- ERDBÄR text -->
  <text x="52" y="100" font-family="Arial Black, Arial" font-weight="900" font-size="34"
        fill="#c8874a" text-anchor="start"
        style="paint-order:stroke" stroke="#5a3010" stroke-width="4">ERDBÄR</text>

  <!-- GESCHMACK banner -->
  <rect x="48" y="108" width="150" height="28" rx="5" fill="#1a4fb5"/>
  <text x="123" y="127" font-family="Arial Black, Arial" font-weight="900" font-size="16"
        fill="white" text-anchor="middle" letter-spacing="2">GESCHMACK</text>

  <!-- BOTTOM BANNER -->
  <rect x="20" y="516" width="360" height="36" rx="10" fill="rgba(150,210,255,0.2)" stroke="rgba(180,220,255,0.5)" stroke-width="1.5"/>
  <!-- Snowflake left -->
  <text x="38" y="540" font-size="18" text-anchor="middle" fill="#60b0ff">❄</text>
  <!-- Bottom text -->
  <text x="200" y="534" font-family="Arial Black, Arial" font-weight="900" font-size="11.5"
        fill="#0a2060" text-anchor="middle" letter-spacing="1">DAS ERSTE GETRÄNK WAS SICH SELBST KÜHLT</text>
  <text x="200" y="534" font-family="Arial Black, Arial" font-weight="900" font-size="11.5"
        fill="#1a6aee" text-anchor="middle" letter-spacing="1" opacity="0.9">DAS ERSTE GETRÄNK WAS SICH SELBST KÜHLT</text>
  <!-- Snowflake right -->
  <text x="362" y="540" font-size="18" text-anchor="middle" fill="#60b0ff">❄</text>

  <!-- Ice icicles bottom of banner -->
  <path d="M60,552 L64,568 L68,552" fill="rgba(180,230,255,0.5)"/>
  <path d="M80,552 L83,562 L86,552" fill="rgba(180,230,255,0.4)"/>
  <path d="M310,552 L313,566 L316,552" fill="rgba(180,230,255,0.5)"/>
  <path d="M325,552 L328,560 L331,552" fill="rgba(180,230,255,0.4)"/>

  <!-- Sparkle / star accents -->
  <g fill="rgba(180,220,255,0.7)" font-size="14">
    <text x="30" y="200">✦</text>
    <text x="358" y="160">✦</text>
    <text x="15" y="320">·</text>
    <text x="378" y="300">·</text>
  </g>
</svg>
